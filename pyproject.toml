[project]
name = "calendar-wfh"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["holidays>=0.46"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, pyflakes, isort
